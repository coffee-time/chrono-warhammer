<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#181716">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chrono 40k">
<title>Chrono CP et PV (outil de fan)</title>
<style>
:root{--bg:#f2f2f2;--bar:#d8d8d8;--fg:#111;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--bar:#222;--fg:#eee}}
:root[data-theme="dark"]{--bg:#111;--bar:#222;--fg:#eee}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.z{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:8px 10px;color:#fff;overflow:hidden}
.z.p0{background:#9b1c1c}.z.p1{background:#1c4f9b}
.z.on{box-shadow:inset 0 0 0 5px #fff}
.z.flip{transform:rotate(180deg)}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.row b{font-size:.85rem}
.nm{background:transparent;border:0;border-bottom:1px dashed rgba(255,255,255,.6);color:#fff;font:600 .95rem system-ui,sans-serif;width:50%;padding:2px 0;user-select:text;-webkit-user-select:text}
.nm:focus{outline:0;border-bottom-style:solid}
.seg{display:flex;gap:4px}
.z .seg button{height:26px;min-width:0;padding:0 8px;font-size:.75rem;border-radius:13px}
.z .seg button.on{background:#fff;color:#222}
.mn{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:5px;padding:6px;background:var(--bar);box-shadow:0 6px 12px rgba(0,0,0,.35)}
.mn.open{display:flex}
.bar .mn button{flex:none;width:100%;padding:12px 4px;font-size:.85rem}
.bx{display:flex;gap:8px}
.box{display:flex;align-items:center;justify-content:space-between;gap:4px;border:2px solid rgba(255,255,255,.55);border-radius:14px;padding:4px 6px;min-width:0}
.box.cpx{flex:1}
.box.pvx{flex:1.5}
.lb{font-size:.75rem;opacity:.85}
.cp,.pvb{display:flex;align-items:center;gap:6px}
.cp span{font-size:1.6rem;font-weight:700;min-width:2ch;text-align:center}
.cp small,.pvt small{opacity:.8}
.z button{border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:18px;height:34px;min-width:34px;padding:0 6px;font-size:.95rem}
.pvt{display:flex;align-items:baseline;gap:6px}
.pvt span{font-size:1.8rem;font-weight:700}
.rs,.ps{display:flex;gap:4px}
.c,.h{flex:1;border-radius:8px;background:rgba(0,0,0,.25);text-align:center;font-size:.7rem;padding:3px 0;line-height:1.25}
.c b{display:block;font-size:.95rem}
.c.cur{background:rgba(0,0,0,.45)}
.c.s{box-shadow:inset 0 0 0 2px #fff}
.h{opacity:.55;padding:6px 0}
.h{transition:flex .15s}.h.on{opacity:1;background:#fff;color:#222;font-weight:800;flex:2.4;font-size:1rem;padding:9px 0}
.tm{display:flex;gap:6px}
.t{flex:1;background:rgba(0,0,0,.25);border-radius:10px;padding:4px 8px;text-align:center;opacity:.55}
.t.cur{opacity:1;background:rgba(0,0,0,.5);box-shadow:inset 0 0 0 2px #fff}
.t small{display:block;font-size:.65rem}
.t span{font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums}
.t.neg span{color:#ffd54a}
.pw{flex:1;display:flex;gap:6px;align-items:stretch;min-height:44px}
.z .pz{flex:0 0 56px;height:auto;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:0}
.z .pz svg{width:26px;height:26px;fill:currentColor}
.z.dep .t[data-k=game],.z.game .t[data-k=dep]{display:none}
.z.dep .ps .h:not(.hd){display:none}.z .ps .hd{display:none}.z.dep .ps .hd{display:block;cursor:default}
.z .pass{flex:1;min-height:44px;height:auto;border-radius:12px;background:rgba(255,255,255,.2);font-weight:600;line-height:1.2}
.pass .cph{display:block;font-size:1.35rem;font-weight:800}
.pass small{display:block;font-weight:400;font-size:.7rem;opacity:.85}
.bar{position:relative;z-index:5;display:flex;flex-wrap:wrap;gap:5px;padding:5px;background:var(--bar)}
.bar .ic{flex:0 0 54px;padding:0;display:flex;align-items:center;justify-content:center}
.bar .ic svg{width:24px;height:24px;fill:currentColor}
.bar .rb{flex:2 1 0;background:#ffd54a;color:#222;font-weight:800;font-size:1rem;letter-spacing:.5px;box-shadow:0 0 0 2px #222 inset}
.bar .rb small{display:block;font-size:.6rem;font-weight:700;letter-spacing:1px;opacity:.75}
.bar .ms-b{flex:2 1 0;background:#2e7d32;color:#fff;font-weight:700;font-size:.85rem}
.bar .mn .rz{background:#b3261e;color:#fff}
.c.cur{background:#ffd54a!important;color:#222;font-weight:800;transform:scale(1.08);box-shadow:0 0 0 2px #fff}
.z .pass.vd{background:rgba(46,125,50,.85)}
.bar button{flex:1 1 22%;padding:9px 2px;border:0;border-radius:8px;background:var(--bg);color:var(--fg);font-size:.75rem}
.ms{display:none;position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--bg);color:var(--fg);padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 24px}
.ms .mh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.ms button,.ms select{font:inherit}
.ms .mh button{border:0;border-radius:8px;background:var(--bar);color:var(--fg);padding:8px 12px}
.ms .mp{border-radius:12px;padding:10px;margin-bottom:12px;color:#fff}
.ms .mp.p0{background:#9b1c1c}.ms .mp.p1{background:#1c4f9b}
.ms h3{margin:0 0 6px;font-size:1rem}
.ms select{width:100%;margin:4px 0;padding:8px;border-radius:8px;border:0;background:rgba(255,255,255,.92);color:#111}
.ms a{color:#fff;text-decoration:underline;font-size:.85rem}
.ms .ob{margin:6px 0;padding:6px;border-radius:8px;background:rgba(0,0,0,.25)}
.ms .vb{display:flex;align-items:center;gap:8px;margin-top:4px}
.ms .vb span{min-width:2ch;text-align:center;font-weight:700}
.ms .vb button{border:0;border-radius:8px;background:rgba(255,255,255,.25);color:#fff;padding:8px 12px}
.ms .sh{margin:8px 0 2px;font-weight:600}
.ms p{margin:6px 0}
.dis{display:block;font-size:.68rem;opacity:.85;padding:2px 2px 0}
.ms .dis2{display:block;font-size:.7rem;opacity:.8;margin-top:6px}
.ms .tt{font-size:.85rem;opacity:.9;margin:6px 0}
.ms .bp{display:block;margin-top:6px;font-size:.9rem}
.ms .vb{flex-wrap:wrap}
.ms.on{display:flex;flex-direction:column;gap:8px;padding-bottom:10px}
.ms .mh{margin:0}
.ms .mp{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;gap:4px;padding:8px;margin:0;overflow:auto}
.ms .r1,.ms .r2{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.ms .r1{flex-wrap:nowrap}
.ms h3{flex:none;margin:0;font-size:.95rem;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms select{flex:1 1 120px;width:auto;min-width:0;margin:0;padding:6px;font-size:.82rem}
.ms .lbl{font-size:.82rem;flex:1}
.ms .pv{min-width:2.2ch;text-align:center;font-size:.9rem}
.ms .r2 button{border:0;border-radius:8px;background:rgba(255,255,255,.25);color:#fff;padding:5px 8px;font-size:.8rem}
.ms .tt,.ms .bp{font-size:.78rem;margin:0}
.ms .ft{justify-content:space-between}
.ms .dis2{flex:none;margin:0}

/* ===== Thème console de commandement (pierre sombre, cadres rivetés, voyants orange) ===== */
:root,:root[data-theme="dark"],:root[data-theme="light"]{--bg:#181716;--bar:#2c2a28;--fg:#ece6d6;--hz:repeating-linear-gradient(-45deg,#d9ad00 0 7px,#151412 7px 14px);--gold:#c9a95c;--or:#e07b16;--stone:linear-gradient(180deg,#45423f,#2b2927 55%,#232120);--slot:linear-gradient(180deg,#0f0e0e,#1b1a19)}
body{font-family:system-ui,"Segoe UI",Arial,sans-serif;background:#181716;color:#ece6d6}
.z{--ac:#b01c1c;position:relative;color:#ece6d6;padding:14px 12px 8px}
.z.p0,.z.p1{background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.05),transparent 40%),radial-gradient(circle at 80% 85%,rgba(0,0,0,.35),transparent 45%),repeating-linear-gradient(35deg,rgba(255,255,255,.018) 0 2px,transparent 2px 5px),var(--stone);box-shadow:inset 0 0 0 1px #77726b,inset 0 0 0 4px #1a1918,inset 0 0 0 5px #55514c}
.z.p0{--ac:#b01c1c}.z.p1{--ac:#2a6fb5}
.z::before{content:"";position:absolute;left:8px;right:8px;top:6px;height:5px;background:var(--hz);border:1px solid #000;opacity:.9;z-index:2}
.z::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;background:radial-gradient(circle at 12px 22px,#8d8880 0 2px,#201f1d 3px,transparent 4px),radial-gradient(circle at calc(100% - 12px) 22px,#8d8880 0 2px,#201f1d 3px,transparent 4px),radial-gradient(circle at 12px calc(100% - 12px),#8d8880 0 2px,#201f1d 3px,transparent 4px),radial-gradient(circle at calc(100% - 12px) calc(100% - 12px),#8d8880 0 2px,#201f1d 3px,transparent 4px)}
.z.on::before{animation:hzm 1.2s linear infinite;background-size:19.8px 19.8px}
@keyframes hzm{to{background-position:19.8px 0}}
.z.on.p0,.z.on.p1{box-shadow:inset 0 0 0 1px #77726b,inset 0 0 0 4px #1a1918,inset 0 0 0 7px var(--or),inset 0 0 34px rgba(224,123,22,.4)}
.z button{color:#ece6d6;background:linear-gradient(180deg,#59554f,#34312e);border:1px solid #0c0b0b;border-radius:3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 1px 0 #000;font-family:inherit;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.z button:active{background:linear-gradient(180deg,#34312e,#4b4742)}
.z .seg button{border-radius:3px;clip-path:none}
.z .seg button.on{background:var(--or);color:#140d04;text-shadow:none;border-color:#000}
.nm{color:#fff;border-bottom:1px solid #6b6660;font:800 1rem system-ui,Arial,sans-serif;text-transform:uppercase;letter-spacing:1px;padding-left:24px;background:radial-gradient(circle at 10px 50%,var(--ac) 0 6px,#000 7px 8px,transparent 9px) no-repeat}
.box,.t,.c,.h{clip-path:none;border-radius:2px;border:2px solid #0b0a0a;background:var(--slot);box-shadow:inset 0 3px 6px rgba(0,0,0,.9),0 1px 0 #6a665f}
.t{background:linear-gradient(180deg,#05070b,#10151d)}
.box{padding:4px 12px}
.cp span{color:#43c8ff;font-family:ui-monospace,Menlo,Consolas,monospace;text-shadow:none}
.pvv{color:#4cdc58;font-family:ui-monospace,Menlo,Consolas,monospace;text-shadow:none}
.t span{color:#f1ecdc;font-family:ui-monospace,Menlo,Consolas,monospace;text-shadow:none;letter-spacing:1px}
.lb,.t small{color:var(--gold);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.c,.h{color:#8f897d}
.c.cur{background:var(--or)!important;color:#140d04;transform:none;box-shadow:0 0 0 2px #000,0 0 10px rgba(224,123,22,.6);font-weight:800}
.c.s{box-shadow:inset 0 3px 6px rgba(0,0,0,.9),0 0 0 2px var(--gold)}
.h.on{background:var(--or);color:#140d04;text-shadow:none;font-weight:800;box-shadow:0 0 0 2px #000,0 0 10px rgba(224,123,22,.6)}
.t{opacity:.55}.t.cur{opacity:1;box-shadow:inset 0 3px 6px rgba(0,0,0,.9),0 0 0 2px var(--gold)}
.t.neg span{color:#ff5a45}
.z .pass,.z .pz{border-radius:3px;clip-path:none;background-color:#2a1d12;border:2px solid var(--or);box-shadow:inset 0 0 0 1px #000,inset 0 0 22px rgba(0,0,0,.65),0 1px 0 #000;color:#f6e7cf}
.z .pz{background-image:linear-gradient(180deg,#3a2616,#241609)}
.z .pass.vd{background-color:#1d3a1d;border-color:#4cdc58}
.z .pass small{color:var(--gold)}
.bar{background:var(--hz) top/100% 4px no-repeat,var(--hz) bottom/100% 4px no-repeat,repeating-linear-gradient(35deg,rgba(255,255,255,.02) 0 2px,transparent 2px 5px),linear-gradient(180deg,#45423f,#252321);padding:10px 8px;box-shadow:inset 0 0 0 1px #77726b}
.bar button{border-radius:3px;background:linear-gradient(180deg,#59554f,#34312e);color:#ece6d6;border:1px solid #0c0b0b;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 1px 0 #000;font-family:inherit;font-weight:800;text-transform:uppercase;letter-spacing:1px;font-size:.85rem}
.bar .ms-b{background:var(--or);color:#140d04;border:2px solid #000;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 0 1px #8a4a10}
.bar .mn button{background:linear-gradient(180deg,#59554f,#34312e)}
.bar .mn .rz{background:linear-gradient(180deg,#a82a1e,#661009);color:#fff}
.mn{background:#242220;border:2px solid #0c0b0b;top:calc(100% - 4px)}
.ms .mp.p0{background:#2e1514;color:#f2d9d4;border:2px solid #b01c1c}
.ms .mp.p1{background:#12202f;color:#d7e6f5;border:2px solid #2a6fb5}
.ms .mh button{border-radius:3px;border:1px solid #0c0b0b;background:linear-gradient(180deg,#59554f,#34312e);color:#ece6d6}

.z{transition:filter .35s}
.z.idle{filter:grayscale(1) brightness(.5)}

.z::before{display:none!important;animation:none!important}
.z.p0,.z.p1{padding-top:8px}
.bar{padding:15px 8px;background:var(--hz) top/100% 7px no-repeat,var(--hz) bottom/100% 7px no-repeat,repeating-linear-gradient(35deg,rgba(255,255,255,.02) 0 2px,transparent 2px 5px),linear-gradient(180deg,#45423f,#252321)}
.mn{top:calc(100% - 7px)}

.nm{width:100%}
.z button.box{height:auto;min-height:60px;flex:1;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--slot);border:2px solid #0b0a0a;border-radius:2px;box-shadow:inset 0 3px 6px rgba(0,0,0,.9),0 1px 0 #6a665f;padding:4px 10px;text-transform:none}
.z button.box:active{box-shadow:inset 0 3px 6px rgba(0,0,0,.9),0 0 0 2px var(--or)}
.box .cpv,.box .pvv{font-size:2.5rem;font-weight:800;line-height:1;font-family:ui-monospace,Menlo,Consolas,monospace}
.box .cpv{color:#43c8ff}.box .pvv{color:#4cdc58}
.box .lb{font-size:.8rem}
.box.cpx{flex:1}.box.pvx{flex:1}
.pp{display:none;position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.78);align-items:center;justify-content:center;padding:12px}
.pp.open{display:flex}
.pp .pn{width:100%;max-width:380px;max-height:100%;overflow-y:auto;background:var(--stone);border:2px solid #0b0a0a;box-shadow:inset 0 0 0 1px #77726b,inset 0 0 0 4px #1a1918,0 10px 30px #000;border-radius:4px;padding:14px;color:#ece6d6;font-family:system-ui,Arial,sans-serif}
.pp .pn.fl{transform:rotate(180deg)}
.pp .ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px}
.pp .pt{color:var(--gold);font-size:.75rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin:12px 0 6px}
.pp .pr{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.pp .pr .pl{flex:1;font-weight:700;font-size:.9rem}
.pp .pr .pl small{display:block;color:#9a9385;font-weight:400;font-size:.7rem}
.pp .pv{min-width:52px;text-align:center;font:800 1.7rem ui-monospace,Menlo,monospace;background:var(--slot);border:2px solid #0b0a0a;box-shadow:inset 0 3px 6px #000;padding:2px 6px}
.pp button{font:inherit;color:#ece6d6;background:linear-gradient(180deg,#59554f,#34312e);border:1px solid #0c0b0b;border-radius:3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 1px 0 #000;font-weight:800;min-width:46px;height:44px;padding:0 8px}
.pp button:active{background:linear-gradient(180deg,#34312e,#4b4742)}
.pp .px{min-width:40px;height:40px;border-radius:50%}
.pp .rt{display:flex;gap:4px}.pp .rt button{flex:1;min-width:0;height:44px;font-size:.8rem;line-height:1.1}
.pp .rt button.on{background:var(--or);color:#140d04}
.pp .sm{margin-top:12px;border-top:1px solid #55514c;padding-top:8px;font-size:.85rem;color:#cfc8b8;display:flex;flex-direction:column;gap:2px}
.pp .sm b{color:#fff}
.pp .ok{width:100%;margin-top:12px;background:var(--or);color:#140d04;height:46px}

.ms.on{gap:10px;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 8px}
.ms .mh{padding:14px 10px;background:var(--hz) top/100% 6px no-repeat,var(--hz) bottom/100% 6px no-repeat,repeating-linear-gradient(35deg,rgba(255,255,255,.02) 0 2px,transparent 2px 5px),linear-gradient(180deg,#45423f,#252321);box-shadow:inset 0 0 0 1px #77726b;margin:0}
.ms .mh b{font-weight:800;text-transform:uppercase;letter-spacing:1px;font-size:.9rem}
.ms .mh>b:first-child{color:var(--gold)}
.ms .mh button{font-weight:800;text-transform:uppercase;letter-spacing:1px;border:1px solid #0c0b0b;border-radius:3px;background:linear-gradient(180deg,#59554f,#34312e);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 1px 0 #000;color:#ece6d6;min-height:38px}
.ms .mh button[data-a="x"]{background:var(--or);color:#140d04;border:2px solid #000}
.ms .mh div b{display:inline-block;min-width:78px;text-align:center;background:var(--slot);border:2px solid #0b0a0a;box-shadow:inset 0 3px 6px rgba(0,0,0,.9),0 1px 0 #6a665f;padding:6px 8px;color:#f1ecdc}
.ms .mp.p0,.ms .mp.p1{--ac:#b01c1c;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.05),transparent 40%),repeating-linear-gradient(35deg,rgba(255,255,255,.018) 0 2px,transparent 2px 5px),var(--stone);color:#ece6d6;border:0;border-radius:0;box-shadow:inset 0 0 0 1px #77726b,inset 0 0 0 4px #1a1918,inset 0 0 0 5px #55514c;padding:12px 12px 10px;gap:6px}
.ms .mp.p1{--ac:#2a6fb5}
.ms h3{color:#fff;text-transform:uppercase;letter-spacing:1px;font-weight:800;padding-left:24px;background:radial-gradient(circle at 10px 50%,var(--ac) 0 6px,#000 7px 8px,transparent 9px) no-repeat}
.ms select{background:var(--slot);color:#ece6d6;border:2px solid #0b0a0a;border-radius:2px;box-shadow:inset 0 3px 6px rgba(0,0,0,.9),0 1px 0 #6a665f;font-size:.85rem;padding:8px 6px}
.ms .lbl{color:#b9ae98}.ms .lbl b{color:#fff}
.ms .pv{font-family:ui-monospace,Menlo,monospace;font-weight:800;color:#4cdc58;background:var(--slot);border:2px solid #0b0a0a;box-shadow:inset 0 3px 6px #000;padding:3px 8px;min-width:3.2ch}
.ms .r2 button,.ms .vb button{border:1px solid #0c0b0b;border-radius:3px;background:linear-gradient(180deg,#59554f,#34312e);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 1px 0 #000;color:#ece6d6;font-weight:800;padding:7px 9px;min-height:34px}
.ms .r2 button:active{background:linear-gradient(180deg,#34312e,#4b4742)}
.ms .tt{color:#cfc8b8}.ms .bp{color:var(--gold);font-weight:700}
.ms input[type=checkbox]{accent-color:#e07b16;width:18px;height:18px;vertical-align:middle}
.ms a{color:var(--gold)}
.ms .dis2{color:#8f897d;opacity:1}
.ms .mh>div{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.ms .mh div b{min-width:70px;padding:7px 6px;white-space:nowrap}
.ms .mh>b:first-child{font-size:.8rem}

.pkp{z-index:45}
.pkp .pn{max-height:88vh;display:flex;flex-direction:column}
.pk{display:flex;flex-direction:column;gap:6px;overflow-y:auto;min-height:0}
.pk button{height:auto;min-height:46px;text-align:left;justify-content:flex-start;padding:8px 12px;font-weight:700;font-size:.9rem;line-height:1.2;display:flex;align-items:center;justify-content:space-between;gap:8px}
.pk button small{color:#4cdc58;font-family:ui-monospace,Menlo,monospace;font-weight:800;white-space:nowrap}
.pk button.on{background:var(--or);color:#140d04}
.pk button.on small{color:#140d04}
.ms button.sel{flex:1 1 120px;min-width:0;text-align:left;background:var(--slot);color:#ece6d6;border:2px solid #0b0a0a;border-radius:2px;box-shadow:inset 0 3px 6px rgba(0,0,0,.9),0 1px 0 #6a665f;padding:8px 26px 8px 8px;font-weight:600;font-size:.85rem;min-height:36px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.ms button.sel::after{content:"▾";position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--or)}
.z .pass .cph{font-size:1.35rem}
.z.dep .pass .cph{font-size:1.1rem}

.bar .ms-b{display:flex;align-items:center;justify-content:center;gap:8px;font-size:1.05rem;padding:14px 4px;flex:2.3 1 0}
.bar .ms-b svg{flex:none}
.ms .prim{display:flex;flex-direction:column;gap:2px;background:var(--or);color:#140d04;border:2px solid #000;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 0 1px #8a4a10;padding:9px 12px;text-transform:uppercase;letter-spacing:.5px}
.ms .prim small{font-size:.68rem;font-weight:800;opacity:.8;letter-spacing:1px}
.ms .prim b{font-size:1.02rem;font-weight:900;line-height:1.15}
.ms button.sbtn{flex:1 1 140px;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;padding:7px 10px;min-height:44px;background:linear-gradient(180deg,#59554f,#34312e);border:1px solid #0c0b0b;border-radius:3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 1px 0 #000;color:#ece6d6}
.ms button.sbtn small{font-size:.65rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--gold)}
.ms button.sbtn b{font-size:.88rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ms button.sbtn:active{background:linear-gradient(180deg,#34312e,#4b4742)}

.z .box.cpx{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 6px;min-height:60px}
.z .box.cpx .cpm{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
.z .box.cpx button{flex:none;min-width:46px;height:46px;font-size:1.6rem;font-weight:800;line-height:1;padding:0}

function prim(i){var a=S.dsp[i],b=S.dsp[1-i];return(a>=0&&b>=0)?DT.pm[a][b]:null}
function objs(i,r){var a=S.obj[i][r];if(!a)a=S.obj[i][r]=[{k:-1,vp:0},{k:-1,vp:0}];return a}
function cap(i,c,r,d){var a=c?S.p[i].sv:S.p[i].pv,o=sum(a)-a[r],nv=Math.max(0,Math.min(a[r]+d,CAP.r,CAP.g-o)),ap=nv-a[r];a[r]=nv;return ap}
var mr=0,msEl=document.getElementById("ms");
function vbtn(at,vs){var h='<button data-a="v"'+at+' data-v="-1">−1</button>';vs.forEach(function(v){h+='<button data-a="v"'+at+' data-v="'+v+'">+'+v+'</button>'});return h}
function renderMs(){
var l=L(),st=msEl.scrollTop,h='<div class="mh"><b>'+l.ms+'</b><div><button data-a="r" data-v="-1">◀</button> <b>'+l.round+(mr+1)+'</b> <button data-a="r" data-v="1">▶</button></div><button data-a="x">'+l.mclose+'</button></div>';
for(var i=0;i<2;i++){
var p=S.p[i],c=prim(i),pat=' data-i="'+i+'" data-t="0"';
h+='<div class="mp p'+i+'"><div class="r1"><h3>'+esc(S.names[i])+'</h3><button class="sel" data-a="pk" data-k="d" data-i="'+i+'">'+(S.dsp[i]>=0?esc(nm(DT.d[S.dsp[i]])):l.disp+'…')+'</button></div>'+(c?'<div class="prim"><small>'+l.prim+'</small><b>'+esc(nm(c))+'</b></div>':'<div class="r2"><span class="lbl"><i>'+l.both+'</i></span></div>');
if(c)h+='<div class="r2"><b class="pv">'+p.pv[mr]+' '+l.vp+'</b>'+vbtn(pat,c.v)+'</div>';
objs(i,mr).forEach(function(o,q){
var at=' data-i="'+i+'" data-q="'+q+'" data-t="1"';
h+='<div class="r2"><button class="sbtn" data-a="pk" data-k="s" data-i="'+i+'" data-q="'+q+'"><small>'+l.sec+' '+(q+1)+'</small><b>'+(o.k>=0?esc(nm(DT.s[o.k])):l.pick)+'</b></button>'+(o.k>=0?'<b class="pv">'+o.vp+'</b>'+vbtn(at,DT.s[o.k].v):'')+'</div>'});
h+='<div class="r2 ft"><span class="tt">'+l.pri+' '+sum(p.pv)+'/'+CAP.g+' · '+l.sec+' '+sum(p.sv)+'/'+CAP.g+'</span><label class="bp"><input type="checkbox" data-a="b" data-i="'+i+'"'+(S.bp[i]?" checked":"")+'> '+l.bp+'</label></div></div>'}
h+='<small class="dis2">'+l.disc+'</small>';
msEl.innerHTML=h;msEl.scrollTop=st}
msEl.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var a=b.dataset.a;
if(a==="pk"){openPick(b.dataset.k,Number(b.dataset.i),Number(b.dataset.q||0));return}
if(a==="x"){msEl.classList.remove("on");return}
if(a==="r"){mr=Math.max(0,Math.min(4,mr+Number(b.dataset.v)));renderMs();return}
if(a==="v"){var i=Number(b.dataset.i),d=Number(b.dataset.v);
if(b.dataset.t==="1"){var o=objs(i,mr)[Number(b.dataset.q)];d=Math.max(d,-o.vp);o.vp=Math.max(0,o.vp+cap(i,1,mr,d))}
else cap(i,0,mr,d);
save();renderMs();draw()}});
msEl.addEventListener("change",function(e){var t=e.target,a=t.dataset.a,i=Number(t.dataset.i);
if(a==="b")S.bp[i]=t.checked?1:0;
save();renderMs();draw()});
function applyPick(k,i,q,v){if(k==="d")S.dsp[i]=v;else{var o=objs(i,mr)[q];o.k=v;if(v<0){cap(i,1,mr,-o.vp);o.vp=0}}save();renderMs();draw()}
var pkS=null;
function openPick(k,i,q){pkS={k:k,i:i,q:q};var l=L(),cur=k==="d"?S.dsp[i]:objs(i,mr)[q].k,list=k==="d"?DT.d:DT.s,h='<div class="ph"><span>'+(k==="d"?l.disp:l.sec+" "+(q+1))+'</span><button class="px" data-x="1" aria-label="'+l.ok+'">✕</button></div><div class="pk">';
h+='<button data-v="-1"'+(cur<0?' class="on"':'')+'>—</button>';
list.forEach(function(d,j){h+='<button data-v="'+j+'"'+(cur===j?' class="on"':'')+'>'+esc(nm(d))+(k==="s"&&d.v!==undefined?' <small>'+(Array.isArray(d.v)?d.v.join(' / '):d.v)+' '+l.vp+'</small>':'')+'</button>'});
h+='</div>';document.getElementById("pkn").innerHTML=h;document.getElementById("pk").classList.add("open")}
function closePick(){pkS=null;document.getElementById("pk").classList.remove("open")}
document.getElementById("pkn").addEventListener("click",function(e){var b=e.target.closest("button");if(!b||!pkS)return;if(b.dataset.x){closePick();return}
if(b.dataset.v!==undefined){var p=pkS;closePick();applyPick(p.k,p.i,p.q,Number(b.dataset.v))}});
document.getElementById("pk").addEventListener("click",function(e){if(e.target===this)closePick()});
document.getElementById("bs").onclick=function(){mr=S.round;renderMs();msEl.classList.add("on")};

var ppI=-1,ppR=0,ppK="cp";
function openPp(i,k){ppI=i;ppK=k;ppR=S.round;rp();document.getElementById("pp").classList.add("open")}
function closePp(){ppI=-1;document.getElementById("pp").classList.remove("open")}
function rp(){if(ppI<0)return;var i=ppI,p=S.p[i],l=L(),h="";
h+='<div class="ph"><span>'+S.names[i]+'</span><button class="px" data-x="1" aria-label="'+l.ok+'">✕</button></div>';
if(ppK==='cp')h+='<div class="pt">'+l.ppc+'</div><div class="pr"><span class="pl">CP</span><button data-cp="-1">−1</button><span class="pv">'+p.cp+'</span><button data-cp="1">+1</button><button data-cp="2">+2</button></div>';
if(ppK==='vp')h+='<div class="pt">'+l.ppv+'</div>';
if(ppK==="vp")[["pv",l.pri,0],["sv",l.sec,1]].forEach(function(q){var a=p[q[0]];
h+='<div class="pr" style="margin-top:8px"><span class="pl">'+q[1]+'<small>'+a[ppR]+' / '+CAP.r+' · '+sum(a)+' / '+CAP.g+'</small></span><button data-v="'+q[2]+':-5">−5</button><button data-v="'+q[2]+':-1">−1</button><span class="pv">'+a[ppR]+'</span><button data-v="'+q[2]+':1">+1</button><button data-v="'+q[2]+':5">+5</button></div>'});
if(ppK==='vp')h+='<div class="sm"><span>'+l.ptl+' : <b>'+(p.pv[ppR]+p.sv[ppR])+'</b></span><span>'+l.pri+' : <b>'+sum(p.pv)+'</b> · '+l.sec+' : <b>'+sum(p.sv)+'</b></span><span>'+l.gtl+' : <b>'+(sum(p.pv)+sum(p.sv))+'</b></span></div>';
h+='<button class="ok" data-x="1">'+l.ok+'</button>';
var pn=document.getElementById("pn");pn.innerHTML=h;pn.classList.toggle("fl",i===0&&S.flip)}
document.getElementById("pn").addEventListener("click",function(e){var b=e.target.closest("button");if(!b||ppI<0)return;
if(b.dataset.x){closePp();return}
if(b.dataset.cp){S.p[ppI].cp=Math.max(0,S.p[ppI].cp+Number(b.dataset.cp))}
else if(b.dataset.r){ppR=Number(b.dataset.r);S.sel[ppI]=ppR}
else if(b.dataset.v){var q=b.dataset.v.split(":");cap(ppI,Number(q[0]),ppR,Number(q[1]))}
save();draw();rp()});
document.getElementById("pp").addEventListener("click",function(e){if(e.target===this)closePp()});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closePp()});

build(0);build(1);labels();draw();
</script></body></html>
