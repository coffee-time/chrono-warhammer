<style>
:root{--bg:#f2f2f2;--bar:#d8d8d8;--fg:#111;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--bar:#222;--fg:#eee}}
:root[data-theme="dark"]{--bg:#111;--bar:#222;--fg:#eee}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.z{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:8px 10px;color:#fff;overflow:hidden}
.z.p0{background:#9b1c1c}.z.p1{background:#1c4f9b}
.z.on{box-shadow:inset 0 0 0 5px #fff}
.z.flip{transform:rotate(180deg)}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.row b{font-size:.85rem}
.nm{background:transparent;border:0;border-bottom:1px dashed rgba(255,255,255,.6);color:#fff;font:600 .95rem system-ui,sans-serif;width:60%;padding:2px 0;user-select:text;-webkit-user-select:text}
.nm:focus{outline:0;border-bottom-style:solid}
.bx{display:flex;gap:8px}
.box{display:flex;align-items:center;justify-content:space-between;gap:4px;border:2px solid rgba(255,255,255,.55);border-radius:14px;padding:4px 6px;min-width:0}
.box.cpx{flex:1}
.box.pvx{flex:1.5}
.lb{font-size:.75rem;opacity:.85}
.cp,.pvb{display:flex;align-items:center;gap:6px}
.cp span{font-size:1.6rem;font-weight:700;min-width:2ch;text-align:center}
.cp small,.pvt small{opacity:.8}
.z button{border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:18px;height:34px;min-width:34px;padding:0 6px;font-size:.95rem}
.pvt{display:flex;align-items:baseline;gap:6px}
.pvt span{font-size:1.8rem;font-weight:700}
.rs,.ps{display:flex;gap:4px}
.c,.h{flex:1;border-radius:8px;background:rgba(0,0,0,.25);text-align:center;font-size:.7rem;padding:3px 0;line-height:1.25}
.c b{display:block;font-size:.95rem}
.c.cur{background:rgba(0,0,0,.45)}
.c.s{box-shadow:inset 0 0 0 2px #fff}
.h{opacity:.55;padding:6px 0}
.h.on{opacity:1;background:#fff;color:#222;font-weight:700}
.tm{display:flex;gap:6px}
.t{flex:1;background:rgba(0,0,0,.25);border-radius:10px;padding:3px 8px;text-align:center;opacity:.6}
.t.cur{opacity:1;background:rgba(0,0,0,.45)}
.t small{display:block;font-size:.65rem}
.t span{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.t.neg span{color:#ffd54a}
.z .pass{flex:1;min-height:44px;height:auto;border-radius:12px;background:rgba(255,255,255,.2);font-weight:600;line-height:1.2}
