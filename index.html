<style>
:root{--bg:#f2f2f2;--bar:#d8d8d8;--fg:#111;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--bar:#222;--fg:#eee}}
:root[data-theme="dark"]{--bg:#111;--bar:#222;--fg:#eee}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.z{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:8px 10px;color:#fff;overflow:hidden}
.z.p0{background:#9b1c1c}.z.p1{background:#1c4f9b}
.z.on{box-shadow:inset 0 0 0 5px #fff}
.z.flip{transform:rotate(180deg)}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.row b{font-size:.85rem}
.nm{background:transparent;border:0;border-bottom:1px dashed rgba(255,255,255,.6);color:#fff;font:600 .95rem system-ui,sans-serif;width:60%;padding:2px 0;user-select:text;-webkit-user-select:text}
.nm:focus{outline:0;border-bottom-style:solid}
.bx{display:flex;gap:8px}
.box{display:flex;align-items:center;justify-content:space-between;gap:4px;border:2px solid rgba(255,255,255,.55);border-radius:14px;padding:4px 6px;min-width:0}
.box.cpx{flex:1}
.box.pvx{flex:1.5}
.lb{font-size:.75rem;opacity:.85}
.cp,.pvb{display:flex;align-items:center;gap:6px}
.cp span{font-size:1.6rem;font-weight:700;min-width:2ch;text-align:center}
.cp small,.pvt small{opacity:.8}
.z button{border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:18px;height:34px;min-width:34px;padding:0 6px;font-size:.95rem}
.pvt{display:flex;align-items:baseline;gap:6px}
.pvt span{font-size:1.8rem;font-weight:700}
.rs,.ps{display:flex;gap:4px}
.c,.h{flex:1;border-radius:8px;background:rgba(0,0,0,.25);text-align:center;font-size:.7rem;padding:3px 0;line-height:1.25}
.c b{display:block;font-size:.95rem}
.c.cur{background:rgba(0,0,0,.45)}
.c.s{box-shadow:inset 0 0 0 2px #fff}
.h{opacity:.55;padding:6px 0}
.h.on{opacity:1;background:#fff;color:#222;font-weight:700}
.tm{display:flex;gap:6px}
.t{flex:1;background:rgba(0,0,0,.25);border-radius:10px;padding:3px 8px;text-align:center;opacity:.6}
.t.cur{opacity:1;background:rgba(0,0,0,.45)}
.t small{display:block;font-size:.65rem}
.t span{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.t.neg span{color:#ffd54a}
.z .pass{flex:1;min-height:44px;height:auto;border-radius:12px;background:rgba(255,255,255,.2);font-weight:600;line-height:1.2}

var last=0,armed=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function fmt(v){var s=Math.ceil(v),n=s<0;s=Math.abs(s);var h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60;
return(n?"-":"")+(h?h+":"+String(m).padStart(2,"0"):String(m).padStart(2,"0"))+":"+String(c).padStart(2,"0")}
function sum(a){return a.reduce(function(x,y){return x+y},0)}
function tick(){if(S.run&&S.active!==null){var n=Date.now();S.p[S.active][S.tp]-=(n-last)/1000;last=n}}
function endTurn(i){S.done++;if(S.done>=2){S.round=Math.min(4,S.round+1);S.done=0;S.sel=[S.round,S.round]}S.active=1-i;S.ph=0}
function build(i){
var z=document.getElementById("z"+i),h="";
h+='<div class="row"><input class="nm" maxlength="20" aria-label="Nom du joueur '+(i+1)+'"></div>';
h+='<div class="bx"><div class="box cpx"><small class="lb">CP</small><div class="cp"><button data-d="-1">−</button><span class="cpv"></span><button data-d="1">+</button></div></div><div class="box pvx"><div class="pvt"><small class="lb">PV</small><span class="pvv"></span></div><div class="pvb"><button data-v="-1">−1</button><button data-v="1">+1</button><button data-v="5">+5</button></div></div></div>';
h+='<div class="rs">';for(var r=0;r<5;r++)h+='<div class="c" data-r="'+r+'"></div>';h+='</div>';
h+='<div class="ps">';for(var k=0;k<5;k++)h+='<div class="h" data-p="'+k+'">'+PH[k]+'</div>';h+='</div>';
h+='<div class="tm"><div class="t" data-k="dep"><small>Déploiement</small><span></span></div><div class="t" data-k="game"><small>Partie</small><span></span></div></div><button class="pass"></button>';
z.innerHTML=h;
var ni=z.querySelector(".nm");ni.value=S.names[i];ni.oninput=function(){S.names[i]=ni.value;save()};
z.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){S.p[i].cp=Math.max(0,S.p[i].cp+Number(b.dataset.d));save();draw()}});
z.querySelectorAll("[data-v]").forEach(function(b){b.onclick=function(){var a=S.p[i].pv,s=S.sel[i];a[s]=Math.max(0,a[s]+Number(b.dataset.v));save();draw()}});
z.querySelectorAll(".c").forEach(function(c){c.onclick=function(){S.sel[i]=Number(c.dataset.r);save();draw()}});
z.querySelectorAll(".h").forEach(function(c){c.onclick=function(){if(S.active===i){S.ph=Number(c.dataset.p);save();draw()}}});
z.querySelector(".pass").onclick=function(){
tick();
if(S.active===null){S.active=i;S.ph=0}
else if(S.active===i){if(S.ph<4)S.ph++;else endTurn(i)}
else{S.active=i;S.ph=0}
S.run=true;last=Date.now();save();draw()}}
function draw(){
for(var i=0;i<2;i++){
var z=document.getElementById("z"+i),p=S.p[i],me=S.active===i;
z.classList.toggle("on",me&&S.run);
z.classList.toggle("flip",i===0&&S.flip);
z.querySelector(".cpv").textContent=p.cp;
z.querySelector(".pvv").textContent=sum(p.pv);
z.querySelectorAll(".c").forEach(function(c){var r=Number(c.dataset.r),v=p.pv[r];
c.innerHTML="T"+(r+1)+"<b>"+((v>0||r<=S.round)?v:"–")+"</b>";
c.classList.toggle("cur",r===S.round);c.classList.toggle("s",r===S.sel[i])});
z.querySelectorAll(".h").forEach(function(c){c.classList.toggle("on",me&&Number(c.dataset.p)===S.ph)});
z.querySelectorAll(".t").forEach(function(t){var k=t.dataset.k;
t.querySelector("span").textContent=fmt(p[k]);t.classList.toggle("cur",k===S.tp);t.classList.toggle("neg",p[k]<0)});
var b=z.querySelector(".pass");
if(S.active===null)b.innerHTML="Démarrer";
else if(me)b.innerHTML="<small>Phase : "+FULL[S.ph]+"</small>"+(S.ph<4?"Suivant : "+FULL[S.ph+1]+" ▶":"Fin de mon tour ▶");
else b.innerHTML="Prendre la main"}
document.getElementById("bp").textContent=S.run?"Pause":"Reprendre";
document.getElementById("bt").textContent="Tour "+(S.round+1)+"/5";
document.getElementById("bph").textContent="Chrono : "+(S.tp==="dep"?"Déploiement":"Partie");
document.getElementById("br").textContent="Rotation J1 : "+(S.flip?"oui":"non")}
setInterval(function(){tick();if(S.run){save();draw()}},250);
document.getElementById("bp").onclick=function(){if(S.active===null)return;tick();S.run=!S.run;last=Date.now();save();draw()};
document.getElementById("bt").onclick=function(){S.round=(S.round+1)%5;S.sel=[S.round,S.round];S.done=0;save();draw()};
document.getElementById("bph").onclick=function(){tick();S.tp=S.tp==="dep"?"game":"dep";last=Date.now();save();draw()};
document.getElementById("br").onclick=function(){S.flip=!S.flip;save();draw()};
document.getElementById("bz").onclick=function(){var b=this;
if(!armed){armed=1;b.textContent="Confirmer ?";setTimeout(function(){armed=0;b.textContent="Remise à zéro"},3000);return}
armed=0;var nm=S.names;S=fresh();S.names=nm;b.textContent="Remise à zéro";save();draw()};

function tr(D,cells,xs,y,b){D.setFont("helvetica",b?"bold":"normal");cells.forEach(function(c,k){D.text(String(c),xs[k],y)})}
function used(p,k,tot){return fmt(Math.round(tot-p[k]))+" / "+fmt(tot)+(p[k]<0?" (dépassé)":"")}
async function exportPdf(btn){
var dl=null,lab="Export PDF";try{dl=await claude.use("downloads")}catch(e){}
function warn(m){btn.textContent=m;setTimeout(function(){btn.textContent=lab},2500)}
if(!window.jspdf){warn("PDF : bibliothèque non chargée");return}
tick();
var D=new window.jspdf.jsPDF({unit:"mm",format:"a4"}),a=sum(S.p[0].pv),b=sum(S.p[1].pv),y=22;
try{D.addImage(GOB,"PNG",159,9,36,32)}catch(e){}
D.setFont("helvetica","bold");D.setFontSize(18);D.text("Résultats de la partie - Warhammer 40k",15,y);
y+=8;D.setFont("helvetica","normal");D.setFontSize(11);D.text(new Date().toLocaleDateString("fr-FR"),15,y);
y+=14;D.setFont("helvetica","bold");D.setFontSize(15);
D.text(a===b?"Égalité : "+a+" PV chacun":"Vainqueur : "+S.names[a>b?0:1]+" ("+Math.max(a,b)+" PV)",15,y);
y+=16;D.setFontSize(12);D.text("Points de victoire par tour",15,y);y+=8;D.setFontSize(11);
var xs=[15,75,95,115,135,155,175];
tr(D,["Joueur","T1","T2","T3","T4","T5","Total"],xs,y,1);D.line(15,y+2,195,y+2);
for(var i=0;i<2;i++){y+=9;var p=S.p[i];tr(D,[S.names[i].slice(0,24)].concat(p.pv,[sum(p.pv)]),xs,y,0)}
y+=18;D.setFont("helvetica","bold");D.setFontSize(12);D.text("Temps utilisé",15,y);y+=8;D.setFontSize(11);
var x2=[15,75,130];
tr(D,["Joueur","Déploiement","Partie"],x2,y,1);D.line(15,y+2,195,y+2);
for(var j=0;j<2;j++){y+=9;var q=S.p[j];tr(D,[S.names[j].slice(0,24),used(q,"dep",1800),used(q,"game",5400)],x2,y,0)}
if(dl){try{await dl.save({filename:"resultat-warhammer-40k.pdf",data:D.output("arraybuffer")})}catch(e){if(!e||e.code!=="declined")warn("Export impossible : "+(e&&e.code||"erreur"))}return}
try{var u=URL.createObjectURL(D.output("blob")),a2=document.createElement("a");a2.href=u;a2.download="resultat-warhammer-40k.pdf";document.body.appendChild(a2);a2.click();a2.remove();warn(window.top!==window?"Ouvre la page dans l'appli Claude":"PDF téléchargé")}catch(e){warn("Export impossible")}
}
document.getElementById("bx").onclick=function(){exportPdf(this)};
build(0);build(1);draw();
</script></body></html>
